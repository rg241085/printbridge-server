<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7c3aed">
<title>Print shop - PrintBridge</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
  :root { --c:#7c3aed; --c2:#5b21b6; --bg:#f5f3ff; --text:#1f2937; --mut:#6b7280; --ok:#059669; --err:#dc2626; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { background:linear-gradient(150deg,var(--c),var(--c2)); color:#fff; padding:18px 18px 46px; }
  header h1 { margin:0; font-size:22px; }
  header p { margin:4px 0 0; opacity:.9; font-size:14px; }
  main { max-width:520px; margin:-34px auto 0; padding:0 14px 40px; }
  .card { background:#fff; border-radius:16px; padding:16px; margin-bottom:14px; box-shadow:0 1px 4px rgba(0,0,0,.08); }
  .rates { display:flex; gap:10px; }
  .rates div { flex:1; background:var(--bg); border-radius:12px; padding:10px; text-align:center; font-size:13px; color:var(--mut); }
  .rates b { display:block; font-size:20px; color:var(--text); }
  label.r { display:block; font-size:14px; color:var(--mut); margin:14px 0 6px; }
  input.t { width:100%; padding:13px; border-radius:10px; border:1px solid #d1d5db; font-size:16px; }
  .pick { display:block; border:2px dashed #c4b5fd; border-radius:14px; padding:20px 12px; text-align:center; cursor:pointer; background:#faf5ff; margin-top:14px; }
  .pick b { display:block; font-size:17px; color:var(--c); margin-top:4px; }
  .pick small { color:var(--mut); } .pick input { display:none; }
  ul.f { list-style:none; padding:0; margin:10px 0 0; }
  ul.f li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:9px 10px; background:var(--bg); border-radius:10px; margin-bottom:6px; font-size:14px; }
  ul.f li .n { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  ul.f li .s { flex-shrink:0; color:var(--mut); font-size:13px; }
  ul.f li .x { border:0; background:none; color:var(--mut); font-size:18px; }
  .seg { display:flex; border:1px solid #d1d5db; border-radius:10px; overflow:hidden; }
  .seg button { flex:1; border:0; background:#fff; padding:11px 4px; font-size:14px; border-right:1px solid #e5e7eb; color:var(--text); }
  .seg button:last-child { border-right:0; } .seg button.on { background:var(--c); color:#fff; font-weight:600; }
  .stepper { display:flex; align-items:center; width:max-content; border:1px solid #d1d5db; border-radius:10px; overflow:hidden; }
  .stepper button { width:48px; height:44px; border:0; background:#f5f3ff; font-size:22px; color:var(--c); }
  .stepper span { width:52px; text-align:center; font-size:18px; font-weight:600; }
  .btn { width:100%; padding:16px; border:0; border-radius:14px; background:var(--c); color:#fff; font-size:18px; font-weight:600; margin-top:18px; }
  .btn:disabled { background:#9ca3af; }
  .btn.light { background:#ede9fe; color:var(--c); font-size:16px; padding:13px; }
  .btn.red { background:#fee2e2; color:var(--err); font-size:16px; padding:13px; margin-top:10px; }
  .msg { margin-top:12px; padding:12px; border-radius:10px; font-size:15px; display:none; white-space:pre-line; }
  .msg.ok { display:block; background:#ecfdf5; color:var(--ok); } .msg.err { display:block; background:#fef2f2; color:var(--err); }
  .msg.info { display:block; background:#f5f3ff; color:var(--c); }
  .bar { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin-top:12px; display:none; }
  .bar div { height:100%; width:0; background:var(--c); transition:width .2s; }
  .token { text-align:center; padding:6px 0 2px; }
  .token small { color:var(--mut); font-size:14px; }
  .token b { display:block; font-size:64px; color:var(--c); line-height:1.1; }
  .state { text-align:center; font-size:18px; font-weight:600; margin:8px 0 4px; }
  .state.ready { color:var(--ok); font-size:21px; }
  .sub { text-align:center; color:var(--mut); font-size:14px; }
  .total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; border-top:1px dashed #d1d5db; padding-top:10px; margin-top:6px; }
  .hint { font-size:12.5px; color:var(--mut); margin:6px 0 0; line-height:1.5; }
  .hidden { display:none !important; }
  .pulse { animation:p 1.4s infinite; } @keyframes p { 50% { opacity:.45; } }
</style>
</head>
<body>
<header><h1 id="shopName">🖨 Print shop</h1><p>File bhejiye, token lijiye, counter se print le lijiye</p></header>
<main>
  <section class="card hidden" id="closed"><p id="closedMsg"></p><button class="btn light" onclick="location.reload()">🔄 Dobara try kijiye</button></section>

  <!-- ===== Order form ===== -->
  <div id="form" class="hidden">
    <section class="card">
      <div class="rates"><div>Black &amp; White<b id="rBW">₹—</b>per kaagaz</div><div>Color<b id="rC">₹—</b>per kaagaz</div></div>
      <label class="r" for="cname">Aapka naam *</label>
      <input class="t" id="cname" maxlength="40" autocomplete="name" placeholder="jaise Rahul">
      <label class="r" for="cmob">Mobile number <small>(zaroori nahi, sirf shop ko dikhega)</small></label>
      <input class="t" id="cmob" maxlength="15" inputmode="tel" autocomplete="tel" placeholder="98xxxxxxxx">
      <label class="pick">📄<b>File chuniye</b><small>PDF, photo, Word, Excel • ek saath kai files</small>
        <input type="file" id="file" multiple accept=".pdf,image/*,.txt,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.rtf,.odt"></label>
      <ul class="f" id="list"></ul>
    </section>
    <section class="card">
      <label class="r" style="margin-top:0">Copies (har file ki)</label>
      <div class="stepper"><button id="minus">−</button><span id="copies">1</span><button id="plus">+</button></div>
      <label class="r">Rang</label>
      <div class="seg" id="color"><button data-v="bw" class="on">Black &amp; White</button><button data-v="color">Color</button></div>
      <label class="r">Kaun se page</label>
      <div class="seg" id="pagesSeg"><button data-v="all" class="on">Saare</button><button data-v="custom">Chuniye</button></div>
      <input class="t hidden" id="pages" placeholder="jaise 1-3, 5" style="margin-top:8px">
      <button class="btn" id="send" disabled>Shop ko bhejiye</button>
      <div class="bar" id="bar"><div></div></div>
      <div class="msg" id="msg"></div>
      <p class="hint">🔒 Aapki files sirf is shop ke computer tak jaati hain aur kaam ke baad delete ho jaati hain.</p>
    </section>
  </div>

  <!-- ===== Order status ===== -->
  <div id="status" class="hidden">
    <section class="card">
      <div class="token"><small>Aapka token</small><b id="tok">#—</b></div>
      <div class="state" id="state">…</div>
      <div class="sub" id="sub"></div>
    </section>
    <section class="card">
      <ul class="f" id="olist"></ul>
      <div class="total"><span>Kul</span><span id="otot">₹—</span></div>
      <p class="hint" id="payHint">Paisa counter par dijiye.</p>
      <button class="btn red hidden" id="cancel">Order cancel karein</button>
      <button class="btn light hidden" id="again">＋ Naya order</button>
    </section>
  </div>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const code = location.pathname.split("/").filter(Boolean).pop();
  const K = "pbshop." + code;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = b => b > 1048576 ? (b / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(b / 1024)) + " KB";
  const rs = v => "₹" + (Math.round(v * 100) / 100).toString();
  const msg = (t, m) => { $("msg").className = "msg " + t; $("msg").textContent = m; };
  const ALLOWED = ["pdf","jpg","jpeg","png","bmp","gif","webp","txt","doc","docx","xls","xlsx","ppt","pptx","rtf","odt"];
  async function api(path, opts) { const r = await fetch(path, opts); let j = {}; try { j = await r.json(); } catch (e) {} return { status: r.status, ok: r.ok && j.ok !== false, ...j }; }
  const saved = () => { try { return JSON.parse(localStorage.getItem(K)) || {}; } catch (e) { return {}; } };
  const store = o => localStorage.setItem(K, JSON.stringify(Object.assign(saved(), o)));

  let files = [], copies = 1, color = "bw", pagesMode = "all", rates = {};

  async function start() {
    const info = await api(`/api/shop/${code}`).catch(() => ({ ok: false, error: "Internet check kijiye" }));
    if (!info.ok) { $("closed").classList.remove("hidden"); $("closedMsg").textContent = "⚠️ " + (info.error || "Shop abhi band hai"); return; }
    rates = info; document.title = info.name + " - Print"; $("shopName").textContent = "🖨 " + info.name;
    $("rBW").textContent = rs(+info.bw_rate); $("rC").textContent = rs(+info.color_rate);
    const s = saved();
    $("cname").value = s.name || ""; $("cmob").value = s.mobile || "";
    if (s.order) { showStatus(); } else $("form").classList.remove("hidden");
  }

  // ---------- form
  function renderList() {
    $("list").innerHTML = files.map((f, i) => `<li><span class="n">${esc(f.name)}</span><span class="s" id="s${i}">${fmt(f.size)}</span><button class="x" data-i="${i}">×</button></li>`).join("");
    $("send").disabled = !files.length;
  }
  $("list").onclick = e => { const i = e.target.dataset.i; if (i !== undefined) { files.splice(+i, 1); renderList(); } };
  $("file").onchange = e => {
    const bad = [];
    for (const f of e.target.files) (ALLOWED.includes((f.name.split(".").pop() || "").toLowerCase()) ? files : bad).push(f);
    e.target.value = ""; renderList();
    bad.length ? msg("err", "Ye files nahi chalengi: " + bad.map(f => f.name).join(", ")) : $("msg").className = "msg";
  };
  const seg = (id, set) => $(id).onclick = e => { const b = e.target.closest("button"); if (!b) return; set(b.dataset.v); $(id).querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); };
  seg("color", v => color = v);
  seg("pagesSeg", v => { pagesMode = v; $("pages").classList.toggle("hidden", v !== "custom"); if (v === "custom") $("pages").focus(); });
  $("minus").onclick = () => { copies = Math.max(1, copies - 1); $("copies").textContent = copies; };
  $("plus").onclick = () => { copies = Math.min(50, copies + 1); $("copies").textContent = copies; };

  function upload(file, orderId, opts) {
    return new Promise(res => {
      const fd = new FormData();
      fd.append("file", file); fd.append("order_id", orderId); fd.append("customer", $("cname").value.trim());
      fd.append("mobile", $("cmob").value.trim()); fd.append("copies", copies); fd.append("options", JSON.stringify(opts));
      const x = new XMLHttpRequest(); x.open("POST", `/api/shop/${code}/files`);
      x.upload.onprogress = e => { if (e.lengthComputable) $("bar").firstElementChild.style.width = (e.loaded / e.total * 100) + "%"; };
      x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch (e) {} res(x.status === 200 && j.ok ? { ok: true, token: j.token } : { ok: false, error: j.error || "Error " + x.status }); };
      x.onerror = () => res({ ok: false, error: "Internet check kijiye" });
      x.send(fd);
    });
  }
  $("send").onclick = async () => {
    const name = $("cname").value.trim();
    if (!name) { $("cname").focus(); return msg("err", "Pehle apna naam likhiye"); }
    let pages = "all";
    if (pagesMode === "custom") {
      pages = $("pages").value.trim();
      if (!/^\s*\d+\s*(-\s*\d*\s*)?(,\s*\d+\s*(-\s*\d*\s*)?)*,?\s*$/.test(pages)) return msg("err", "Page number sahi likhiye, jaise 1-3, 5");
    }
    store({ name, mobile: $("cmob").value.trim() });
    const orderId = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "" + Math.random()).replace(/[^a-z0-9]/gi, "").slice(0, 32);
    $("send").disabled = true; $("bar").style.display = "block";
    let token = null; const errs = [];
    for (let i = 0; i < files.length; i++) {
      $("bar").firstElementChild.style.width = "0"; $("s" + i).textContent = "⬆️";
      msg("info", `${i + 1}/${files.length}: ${files[i].name} bhej rahe hain…`);
      const r = await upload(files[i], orderId, { pages, color });
      $("s" + i).textContent = r.ok ? "✅" : "❌";
      if (r.ok) token = r.token; else errs.push(`${files[i].name}: ${r.error}`);
    }
    $("bar").style.display = "none";
    if (!token) { $("send").disabled = false; return msg("err", errs.join("\n")); }
    store({ order: orderId, token, errs });
    files = []; renderList();
    showStatus();
  };

  // ---------- status
  const STATE = {
    receiving: ["⏳ File shop tak ja rahi hai…", ""], waiting: ["🕐 Line mein hai", ""],
    printing: ["🖨 Aapka print ho raha hai", "Bas thodi der…"], ready: ["✅ Taiyaar hai! Counter se le lijiye", ""],
    done: ["🙏 Print le liya gaya. Dhanyavaad!", ""], rejected: ["❌ Shop ne ye order nahi liya", ""], cancelled: ["Order cancel ho gaya", ""],
  };
  let timer = null, lastState = "";
  async function showStatus() {
    $("form").classList.add("hidden"); $("status").classList.remove("hidden");
    const s = saved();
    $("tok").textContent = "#" + (s.token || "—");
    const r = await api(`/api/shop/${code}/orders/${s.order}`).catch(() => null);
    if (r && r.ok) {
      const [title, sub] = STATE[r.status] || [r.status, ""];
      $("state").textContent = title; $("state").className = "state" + (r.status === "ready" ? " ready" : "") + (["waiting", "receiving", "printing"].includes(r.status) ? " pulse" : "");
      $("sub").textContent = r.status === "waiting" ? (r.ahead ? `Aapke aage ${r.ahead} order hain` : "Aapka number agla hai") : (r.message && r.status !== "ready" ? r.message : sub);
      $("olist").innerHTML = r.files.map(f => `<li><span class="n">📄 ${esc(f.name)}</span><span class="s">${f.status === "error" ? "❌ " + esc(f.message || "") : f.sheets == null ? (f.status === "receiving" ? "…" : "? kaagaz") : `${f.sheets} × ${f.copies} ${f.color === "color" ? "🎨" : "⚫"} = ${rs(f.price)}`}</span></li>`).join("")
        + (s.errs && s.errs.length ? s.errs.map(e => `<li><span class="n">❌ ${esc(e)}</span></li>`).join("") : "");
      $("otot").textContent = rs(r.total) + (r.total_known ? "" : " +");
      $("payHint").textContent = r.total_known ? "Paisa counter par dijiye." : "Kuch file ke page counter par gine jaayenge.";
      const active = ["receiving", "waiting", "printing", "ready"].includes(r.status);
      $("cancel").classList.toggle("hidden", !["receiving", "waiting"].includes(r.status));
      $("again").classList.toggle("hidden", active && r.status !== "ready");
      if (r.status === "ready" && lastState !== "ready" && navigator.vibrate) navigator.vibrate([200, 100, 200]);
      lastState = r.status;
      if (!active) { clearTimeout(timer); return; }
    } else if (r && r.status === 404 && r.error && r.error.includes("Order")) {
      $("state").textContent = "Order purana ho gaya"; $("sub").textContent = ""; $("again").classList.remove("hidden"); return;
    } else {
      $("sub").textContent = (r && r.error) || "Shop se jud nahi paaye, dobara koshish…";
    }
    clearTimeout(timer); timer = setTimeout(showStatus, 3000);
  }
  $("cancel").onclick = async () => {
    if (!confirm("Order cancel karein?")) return;
    const r = await api(`/api/shop/${code}/orders/${saved().order}/cancel`, { method: "POST" });
    if (!r.ok) alert(r.error || "Cancel nahi hua");
    showStatus();
  };
  $("again").onclick = () => {
    clearTimeout(timer); store({ order: null, token: null, errs: [] }); lastState = "";
    $("status").classList.add("hidden"); $("form").classList.remove("hidden"); $("msg").className = "msg";
  };
  start();
})();
</script>
</body>
</html>
