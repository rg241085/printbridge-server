plugins {
    id "com.android.application"
}

// GitHub Actions se: VERSION_CODE (har build +1), KS_PATH/KS_PASS (signing key, GitHub Secrets se)
def vc = Integer.parseInt(System.getenv("VERSION_CODE") ?: "1")
def ksPath = System.getenv("KS_PATH")

android {
    namespace "com.printbridge.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.printbridge.app"
        minSdk 21
        targetSdk 34
        versionCode vc
        versionName "1.0.${vc}"
    }

    signingConfigs {
        release {
            if (ksPath) {
                storeFile file(ksPath)
                storePassword System.getenv("KS_PASS")
                keyAlias "printbridge"
                keyPassword System.getenv("KS_PASS")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksPath ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
