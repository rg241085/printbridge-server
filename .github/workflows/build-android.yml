# PrintBridge Printer (Android) apne aap banana
# Jab bhi "android" folder badlega, GitHub APK banayega aur "android-latest" release mein daalega.
# Signing key GitHub Secrets se aati hai (ANDROID_KEYSTORE_B64, ANDROID_KEY_PASS), taaki har update
# purani app ke upar install ho sake.
name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          KS="$RUNNER_TEMP/printbridge.jks"
          # Copy-paste mein aaye space / naye line hata do
          CLEAN=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t')
          if [ -z "$CLEAN" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 secret nahi mila - debug key se sign ho raha hai"
            exit 0
          fi
          if ! printf '%s' "$CLEAN" | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_B64 secret sahi copy nahi hua. Secret ko delete karke poori lambi line dobara paste kijiye."
            exit 1
          fi
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d ' \r\n\t')
          if ! keytool -list -keystore "$KS" -storepass "$KS_PASS" -alias printbridge > /dev/null 2>&1; then
            echo "::error::ANDROID_KEY_PASS password is key se match nahi karta (ya key adhuri copy hui). Dono secrets dobara daaliye."
            exit 1
          fi
          echo "KS_PATH=$KS" >> "$GITHUB_ENV"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "Signing key OK"

      - name: Build APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk PrintBridge-Printer.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest PrintBridge-Printer.apk \
            --title "PrintBridge Printer for Android (build ${{ github.run_number }})" \
            --notes "Print from any Android app to the printer connected to your computer." \
            --prerelease --latest=false
